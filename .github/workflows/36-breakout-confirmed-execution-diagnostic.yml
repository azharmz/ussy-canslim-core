name: '#36 Breakout-confirmed execution diagnostic'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/36-breakout-confirmed-execution-diagnostic.yml'
      - 'scripts/run_36_breakout_execution_diagnostic.py'
      - 'src/canslim_research/execution_entry_variants_v1.py'
      - 'docs/methodology/36-breakout-confirmed-execution-diagnostic-v1.md'

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow boto3 numpy
      - name: Download frozen canonical V35 pool artifact
        run: |
          mkdir -p input/v35
          gh run download 34763920536 \
            --repo azharmz/ussy-canslim-research \
            --name v35-historical-pool-34763920536 \
            --dir input/v35
      - name: Run preregistered diagnostic
        run: python scripts/run_36_breakout_execution_diagnostic.py
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e36-breakout-execution-diagnostic-${{ github.run_id }}
          path: |
            results/e36-breakout-execution-diagnostic/summary.json
            results/e36-breakout-execution-diagnostic/execution_decisions.csv
            results/e36-breakout-execution-diagnostic/integrity_findings.csv
            results/e36-breakout-execution-diagnostic/outcomes.csv
          if-no-files-found: warn
          retention-days: 30
