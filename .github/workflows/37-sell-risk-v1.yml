name: '#37 Sell / Risk v1 semantic validation'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/37-sell-risk-v1.yml'
      - 'src/canslim_research/sell_risk_v1.py'
      - 'tests/test_sell_risk_v1.py'
      - 'docs/methodology/37-theory-faithful-sell-risk-spec-v1.md'

permissions:
  contents: read

jobs:
  semantic-validation:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run S37 semantic boundary tests
        run: python -m pytest -q tests/test_sell_risk_v1.py
