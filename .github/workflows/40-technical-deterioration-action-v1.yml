name: "#40 Technical Deterioration Action v1 semantic validation"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/canslim_research/technical_deterioration_action_v1.py"
      - "tests/test_technical_deterioration_action_v1.py"
      - "docs/methodology/40-technical-deterioration-action-spec-v1.md"
      - ".github/workflows/40-technical-deterioration-action-v1.yml"

env:
  PYTHONPATH: src

jobs:
  semantic-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run A40 semantic boundary tests
        run: python -m pytest -q tests/test_technical_deterioration_action_v1.py
