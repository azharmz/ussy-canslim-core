name: "#41 Position Lifecycle v1 semantic validation"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/canslim_research/position_lifecycle_v1.py"
      - "tests/test_position_lifecycle_v1.py"
      - "docs/methodology/41-position-lifecycle-exit-arbiter-spec-v1.md"
      - ".github/workflows/41-position-lifecycle-v1.yml"

env:
  PYTHONPATH: src

jobs:
  semantic-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run L41 semantic boundary tests
        run: python -m pytest -q tests/test_position_lifecycle_v1.py
