name: "#42 Round-Trip Sell Action v1 semantic validation"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/canslim_research/round_trip_action_v1.py"
      - "tests/test_round_trip_action_v1.py"
      - "docs/methodology/42-round-trip-sell-action-spec-v1.md"
      - ".github/workflows/42-round-trip-action-v1.yml"

env:
  PYTHONPATH: src

jobs:
  semantic-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run R42 semantic boundary tests
        run: python -m pytest -q tests/test_round_trip_action_v1.py
