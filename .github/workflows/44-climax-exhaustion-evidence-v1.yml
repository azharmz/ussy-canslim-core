name: "#44 Climax Exhaustion Evidence v1 semantic validation"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/canslim_research/climax_exhaustion_evidence_v1.py"
      - "tests/test_climax_exhaustion_evidence_v1.py"
      - "docs/methodology/44-climax-exhaustion-evidence-spec-v1.md"
      - ".github/workflows/44-climax-exhaustion-evidence-v1.yml"

env:
  PYTHONPATH: src

jobs:
  semantic-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run C44 semantic boundary tests
        run: python -m pytest -q tests/test_climax_exhaustion_evidence_v1.py
