name: "#46 Market State v1 semantic validation"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/canslim_research/market_state_v1.py"
      - "tests/test_market_state_v1.py"
      - "docs/methodology/46-market-state-evidence-classification-spec-v1.md"
      - ".github/workflows/46-market-state-v1.yml"
env:
  PYTHONPATH: src
jobs:
  semantic-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run M46 semantic boundary tests
        run: python -m pytest -q tests/test_market_state_v1.py
