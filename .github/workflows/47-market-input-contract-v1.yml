name: '#47 Market Input Contract v1 semantic validation'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/canslim_research/market_input_contract_v1.py'
      - 'tests/test_market_input_contract_v1.py'
      - 'docs/methodology/47-market-input-data-contract-spec-v1.md'
      - '.github/workflows/47-market-input-contract-v1.yml'

permissions:
  contents: read

jobs:
  semantic-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run M47 semantic boundary tests
        run: python -m pytest -q tests/test_market_input_contract_v1.py
