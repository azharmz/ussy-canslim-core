name: 54 Cycle 1 data readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/canslim_research/leader_cycle1_data_readiness_v1.py'
      - 'tests/test_leader_cycle1_data_readiness_v1.py'
      - '.github/workflows/54-cycle1-data-readiness.yml'

permissions:
  contents: read

jobs:
  semantic-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run data-readiness tests
        run: python -m pytest -q tests/test_leader_cycle1_data_readiness_v1.py
