name: '#54 RS-line evidence v1 semantic validation'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/canslim_research/rs_line_evidence_v1.py'
      - 'tests/test_rs_line_evidence_v1.py'
      - 'docs/methodology/54-rs-line-evidence-v1.md'
      - '.github/workflows/54-rs-line-evidence-v1.yml'

permissions:
  contents: read

jobs:
  semantic-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run RS-line evidence tests
        run: python -m pytest -q tests/test_rs_line_evidence_v1.py
