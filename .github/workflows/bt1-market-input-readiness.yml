name: BT1-M market input readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bt1-market-input-readiness.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check boto3
      - name: Audit canonical historical market inputs
        run: python scripts/audit_bt1_market_inputs.py
      - name: Upload audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: bt1-market-input-readiness-${{ github.run_id }}
          path: results/bt1-market-input-readiness/summary.json
          retention-days: 30
