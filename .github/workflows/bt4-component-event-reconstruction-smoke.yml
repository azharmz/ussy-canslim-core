name: BT4 component event reconstruction smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check boto3 pandas pyarrow
      - name: Install exact frozen O'Neil dependency
        run: python -m pip install 'git+https://github.com/azharmz/ussy-oneil-patterns.git@c433cc1e35a5aa32a46f732cd8c5545935e36e40'
      - name: Rebuild deterministic BT3 input manifest
        run: python scripts/bt3_component_runner.py --sample-size 10
      - name: Run bounded BT4 reconstruction smoke
        run: python scripts/bt4_component_event_reconstruction_smoke.py
      - name: Execute frozen O'Neil engine on causal sample
        run: python scripts/bt4_oneil_pinned_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: bt4-component-event-smoke
          path: |
            bt4-component-event-smoke.json
            bt4-oneil-pinned-smoke.json
