name: BT5C cross-asof landmark equivalence probe
on:
  push:
    branches: [bt5c-cross-asof-prototype]
    paths:
      - 'scripts/bt5c_cross_asof_landmark_probe.py'
      - 'scripts/bt5c_cross_asof_landmark_runner.py'
      - '.github/workflows/bt5c-landmark-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check boto3 pandas pyarrow
      - name: Install exact frozen O'Neil dependency
        run: python -m pip install 'git+https://github.com/azharmz/ussy-oneil-patterns.git@c433cc1e35a5aa32a46f732cd8c5545935e36e40'
      - name: Run multi-security cross-asof landmark equivalence probe
        run: PYTHONPATH=scripts python scripts/bt5c_cross_asof_landmark_runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bt5c-landmark-probe
          path: bt5c-landmark-probe.json
