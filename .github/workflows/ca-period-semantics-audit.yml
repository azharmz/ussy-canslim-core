name: C/A period semantics audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-ca-period-semantics-audit'
      - '.github/workflows/ca-period-semantics-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow boto3
      - name: Audit period semantics
        run: python scripts/audit_ca_period_semantics.py
      - name: Show summary
        run: cat results/ca-period-semantics-audit/summary.json
      - name: Upload audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: ca-period-semantics-audit-${{ github.run_id }}
          path: |
            results/ca-period-semantics-audit/summary.json
            results/ca-period-semantics-audit/latest_state_mismatches.csv
            results/ca-period-semantics-audit/multi_accepted_periods.csv
          retention-days: 30
