name: CAN SLIM v2 shadow qualified p33
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canslim-v2-shadow-p33
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas pyarrow boto3
      - name: Build fresh read-only v2 watchlist
        env:
          CANSLIM_V2_WATCHLIST_OUTPUT: shadow-v2-watchlist.json
        run: python scripts/build_shadow_v2_watchlist.py
      - name: Run frozen p33 for qualified identities only
        env:
          CANSLIM_V2_WATCHLIST_INPUT: shadow-v2-watchlist.json
          CANSLIM_V2_P33_OUTPUT: shadow-v2-p33.json
        run: python scripts/run_shadow_v2_p33.py
      - uses: actions/upload-artifact@v6
        with:
          name: canslim-v2-shadow-qualified-p33-${{ github.run_id }}
          path: |
            shadow-v2-watchlist.json
            shadow-v2-p33.json
          retention-days: 7
