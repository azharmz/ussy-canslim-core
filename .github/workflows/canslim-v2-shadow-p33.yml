name: CAN SLIM v2 production
on:
  workflow_dispatch:
  schedule:
    # Reconcile after ussy-data production has had time to finalize the preceding US session.
    - cron: '45 8 * * 2-6'
permissions:
  contents: read
concurrency:
  group: canslim-v2-shadow-p33
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout frozen O'Neil pattern repo
        uses: actions/checkout@v7
        with:
          repository: azharmz/ussy-oneil-patterns
          path: oneil-patterns
          ref: 3d0b35272d89c5a6f1329e8dea865b3cf7a32b0f
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --disable-pip-version-check pytest pandas pyarrow boto3 numpy
          python -m pip install --disable-pip-version-check -e ./oneil-patterns
      - name: Gate on new finalized READY session
        id: cadence
        run: |
          python - <<'PY'
          import json,os,boto3
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],region_name='auto',aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'])
          b=os.environ['R2_BUCKET_NAME']
          ready=json.loads(s3.get_object(Bucket=b,Key='production/ready/current.json')['Body'].read())
          ready_date=str(ready.get('as_of_date') or ready.get('asof_date') or '')
          try:
            cur=json.loads(s3.get_object(Bucket=b,Key='canslim/v2/current.json')['Body'].read()); cur_date=str(cur.get('decision_date') or '')
          except Exception as ex:
            if 'NoSuchKey' not in str(ex): raise
            cur_date=''
          if not ready_date: raise RuntimeError('READY_POINTER_MISSING_ASOF_DATE')
          run=ready_date>cur_date
          with open(os.environ['GITHUB_OUTPUT'],'a') as fh: fh.write(f'run={str(run).lower()}\\nready_date={ready_date}\\ncurrent_date={cur_date}\\n')
          print(json.dumps({'ready_date':ready_date,'current_v2_date':cur_date,'run':run},sort_keys=True))
          PY
      - name: Build fresh read-only v2 watchlist
        if: steps.cadence.outputs.run == 'true'
        env:
          CANSLIM_V2_WATCHLIST_OUTPUT: shadow-v2-watchlist.json
        run: python scripts/build_shadow_v2_watchlist.py
      - name: Run frozen p33 for qualified identities only
        if: steps.cadence.outputs.run == 'true'
        env:
          CANSLIM_V2_WATCHLIST_INPUT: shadow-v2-watchlist.json
          CANSLIM_V2_P33_OUTPUT: shadow-v2-p33.json
        run: python scripts/run_shadow_v2_p33.py
      - name: Build role-aware v2 shadow candidates
        if: steps.cadence.outputs.run == 'true'
        env:
          CANSLIM_V2_WATCHLIST_INPUT: shadow-v2-watchlist.json
          CANSLIM_V2_P33_INPUT: shadow-v2-p33.json
          CANSLIM_V2_CANDIDATE_OUTPUT: shadow-v2-candidates.json
        run: python scripts/run_shadow_v2_candidate.py
      - name: Build causal v2 T+1 shadow execution
        if: steps.cadence.outputs.run == 'true'
        env:
          CANSLIM_V2_CANDIDATE_INPUT: shadow-v2-candidates.json
          CANSLIM_V2_EXECUTION_OUTPUT: shadow-v2-execution.json
        run: python scripts/run_shadow_v2_execution.py
      - name: Build v2 shadow lifecycle boundary
        if: steps.cadence.outputs.run == 'true'
        env:
          CANSLIM_V2_EXECUTION_INPUT: shadow-v2-execution.json
          CANSLIM_V2_LIFECYCLE_OUTPUT: shadow-v2-lifecycle.json
        run: python scripts/run_shadow_v2_lifecycle.py
      - name: Summarize v2 shadow observation
        if: steps.cadence.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          x=json.load(open("shadow-v2-candidates.json"))
          stages=x.get("stage_counts",{})
          print(json.dumps({
            "decision_date":x.get("decision_date"),
            "qualified_security_ids":x.get("qualified_security_ids",[]),
            "candidate_stage_counts":stages,
            "eligible_count":stages.get("CANSLIM_V2_ELIGIBLE",0),
            "production_cutover":True,
            "entry_lifecycle_write":False
          },sort_keys=True))
          PY
      - name: Verify v2 production publisher contract
        if: steps.cadence.outputs.run == 'true'
        run: python -m pytest -q tests/test_v2_production_publisher.py
      - name: Publish verified v2 production snapshot and pointer
        if: steps.cadence.outputs.run == 'true'
        env:
          CANSLIM_V2_PUBLISH_DRY_RUN: '0'
        run: python scripts/publish_v2_production.py
      - uses: actions/upload-artifact@v6
        if: steps.cadence.outputs.run == 'true'
        with:
          name: canslim-v2-shadow-qualified-p33-${{ github.run_id }}
          path: |
            shadow-v2-watchlist.json
            shadow-v2-p33.json
            shadow-v2-candidates.json
            shadow-v2-execution.json
            shadow-v2-lifecycle.json
          retention-days: 7
