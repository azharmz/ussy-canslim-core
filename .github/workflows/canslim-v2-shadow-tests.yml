name: CAN SLIM v2 shadow contract tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/canslim_research/watchlist_v2.py'
      - 'src/canslim_research/eligibility_v2.py'
      - 'src/canslim_research/shadow_v2_pipeline.py'
      - 'tests/test_shadow_v2_contracts.py'
      - '.github/workflows/canslim-v2-shadow-tests.yml'

permissions:
  contents: read

concurrency:
  group: canslim-v2-shadow-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest pandas
      - name: Run shadow v2 contract tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_shadow_v2_contracts.py
