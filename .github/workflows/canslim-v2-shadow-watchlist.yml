name: CAN SLIM v2 shadow watchlist

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/build_shadow_v2_watchlist.py'
      - 'src/canslim_research/watchlist_v2.py'
      - 'src/canslim_research/shadow_v2_pipeline.py'
      - '.github/workflows/canslim-v2-shadow-watchlist.yml'

permissions:
  contents: read

concurrency:
  group: canslim-v2-shadow-watchlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      CANSLIM_V2_WATCHLIST_OUTPUT: shadow-v2-watchlist.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas pyarrow boto3
      - name: Build read-only PIT watchlist checkpoint
        run: python scripts/build_shadow_v2_watchlist.py
      - uses: actions/upload-artifact@v6
        with:
          name: canslim-v2-shadow-watchlist-${{ github.run_id }}
          path: shadow-v2-watchlist.json
          retention-days: 7
