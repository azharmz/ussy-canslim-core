name: E0 rolling baseline v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-e0-rolling-baseline'
      - '.github/workflows/e0-rolling-baseline.yml'

permissions:
  contents: read

jobs:
  e0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
      CANDIDATE_V2_SMOKE_SECURITIES: '10'
    steps:
      - uses: actions/checkout@v7
      - name: Checkout frozen #33 dependency
        uses: actions/checkout@v7
        with:
          repository: azharmz/ussy-oneil-patterns
          path: _deps/ussy-oneil-patterns
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas pyarrow boto3 numpy pytest
          python -m pip install -e ./_deps/ussy-oneil-patterns
      - name: Run #34 candidate unit tests
        run: PYTHONPATH=src pytest -q tests/test_candidate_v2.py
      - name: Run bounded #34 live R2 smoke
        run: PYTHONPATH=src python scripts/run_candidate_v2_smoke_bounded.py
      - name: Show #34 summary
        run: cat results/candidate-v2-smoke/summary.json
      - name: Run E0 rolling baseline smoke
        run: python scripts/run_e0_rolling_baseline.py
      - name: Show E0 summary
        run: cat results/e0-rolling-baseline-v1/summary.json
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: e0-and-candidate-v2-${{ github.run_id }}
          path: |
            results/candidate-v2-smoke/summary.json
            results/candidate-v2-smoke/pattern_manifest.json
            results/candidate-v2-smoke/patterns.jsonl
            results/candidate-v2-smoke/candidates.jsonl
            results/e0-rolling-baseline-v1/summary.json
            results/e0-rolling-baseline-v1/candidates.csv
            results/e0-rolling-baseline-v1/daily_summary.csv
            results/e0-rolling-baseline-v1/ready_pointer.json
            results/e0-rolling-baseline-v1/spy_pointer.json
          retention-days: 30
