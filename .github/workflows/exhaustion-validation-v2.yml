name: EXH2 prospective exhaustion validation

on:
  workflow_dispatch:
  schedule:
    # 05:15 UTC Tue-Sat: after Production OHLCV, SPY, and FWD1 collection windows.
    - cron: '15 5 * * 2-6'
  push:
    branches: [main]
    paths:
      - '.github/workflows/exhaustion-validation-v2.yml'
      - 'scripts/run_exhaustion_validation_v2.py'
      - 'docs/methodology/exhaustion-validation-v2.md'

permissions:
  contents: read

concurrency:
  group: exh2-prospective-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow boto3 numpy
      - name: Collect prospective EXH2 evidence
        run: python scripts/run_exhaustion_validation_v2.py
      - name: Show EXH2 status
        if: always()
        run: cat results/exhaustion-validation-v2/summary.json || true
      - name: Upload immutable EXH2 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exhaustion-validation-v2-${{ github.run_id }}
          path: |
            results/exhaustion-validation-v2/summary.json
            results/exhaustion-validation-v2/observations.csv
            results/exhaustion-validation-v2/group_summary.csv
            results/exhaustion-validation-v2/membership_snapshot.json
          retention-days: 90
