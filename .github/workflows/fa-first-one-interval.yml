name: FA-first one-interval validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/fa-first-one-interval-trigger'

permissions:
  contents: read

jobs:
  medp-2021:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check boto3 pandas pyarrow
      - name: Run one frozen fundamental PASS interval
        run: python scripts/run_fa_first_one_interval.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa-first-medp-2021-${{ github.run_id }}
          path: artifacts/fa_first_medp_2021.json
          if-no-files-found: warn
