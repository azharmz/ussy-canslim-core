name: Flat Base R1-E independent holdout
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q pandas yfinance
      - run: python scripts/flat_base_r1e_holdout.py
      - uses: actions/upload-artifact@v4
        with:
          name: flat-base-r1e-holdout
          path: artifacts/research/flat-base-r1e.json
