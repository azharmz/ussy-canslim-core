name: Flat Base R1-E independent holdout
on:
  push:
    branches: [research/oneil-morphology-vnext]
    paths: [scripts/flat_base_r1e_holdout.py, .github/workflows/flat-base-r1e-holdout.yml]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q pandas yfinance
      - run: python scripts/flat_base_r1e_holdout.py
      - uses: actions/upload-artifact@v4
        with:
          name: flat-base-r1e-holdout
          path: artifacts/research/flat-base-r1e.json
