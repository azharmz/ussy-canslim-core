name: Flat Base vNext R2-A development replay
on:
  push:
    branches: [research/oneil-morphology-vnext]
    paths: [scripts/flat_base_r2a_development.py, .github/workflows/flat-base-r2a-development.yml]
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q pandas yfinance
      - run: python scripts/flat_base_r2a_development.py
      - uses: actions/upload-artifact@v4
        with:
          name: flat-base-r2a-development
          path: artifacts/research/flat-base-r2a-development.json
