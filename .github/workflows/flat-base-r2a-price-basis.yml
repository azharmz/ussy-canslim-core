name: Flat Base R2-A price-basis audit
on:
  push:
    branches: [research/oneil-morphology-vnext]
    paths: [.github/workflows/flat-base-r2a-price-basis.yml, scripts/flat_base_r2a_price_basis.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q yfinance
      - run: python scripts/flat_base_r2a_price_basis.py
