name: Flat Base vNext R2-B control replay
on:
  push:
    branches: [research/oneil-morphology-vnext]
    paths: [.github/workflows/flat-base-r2b-control.yml, scripts/flat_base_r2b_control.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -q pandas yfinance
      - run: python scripts/flat_base_r2b_control.py
