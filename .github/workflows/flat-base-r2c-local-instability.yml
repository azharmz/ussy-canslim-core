name: Flat Base vNext R2-C local-instability replay
on:
  push:
    branches: [research/oneil-morphology-vnext]
    paths: [.github/workflows/flat-base-r2c-local-instability.yml, scripts/flat_base_r2c_local_instability.py]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -q pandas yfinance
      - run: python scripts/flat_base_r2c_local_instability.py
