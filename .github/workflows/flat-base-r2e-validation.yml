name: Flat Base vNext R2-E untouched validation
on:
  push:
    branches: [research/oneil-morphology-vnext]
    paths: [.github/workflows/flat-base-r2e-validation.yml, scripts/flat_base_r2e_validation.py]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -q pandas yfinance
      - run: python scripts/flat_base_r2e_validation.py
