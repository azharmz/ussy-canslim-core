name: Full-M validation v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-m-validation-v1.yml'
      - 'scripts/run_full_m_validation_v1.py'
      - 'docs/methodology/full-m-validation-v1.md'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas pyarrow boto3 numpy
      - name: Verify frozen execution semantics
        run: python -m pytest -q tests/test_entry_timing.py tests/test_execution.py tests/test_technical.py
      - name: Run preregistered full-M sidecar
        run: python scripts/run_full_m_validation_v1.py
      - name: Show summary
        run: cat results/full-m-validation-v1/summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-m-validation-v1-${{ github.run_id }}
          path: results/full-m-validation-v1/
          retention-days: 90
