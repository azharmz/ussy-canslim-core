name: Historical BT5 checkpoint-resume validation

on:
  workflow_dispatch:
    inputs:
      sample_securities:
        description: Deterministic inventory-prefix securities (validation only)
        required: false
        default: '2'
      max_sessions:
        description: Causal prefix sessions per security for recovery validation only
        required: false
        default: '250'

permissions:
  contents: read

concurrency:
  group: historical-bt5-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check boto3 pandas pyarrow pytest
          python -m pip install 'git+https://github.com/azharmz/ussy-oneil-patterns.git@c433cc1e35a5aa32a46f732cd8c5545935e36e40'
      - name: Recovery primitive tests
        run: pytest -q tests/test_historical_bt5_recovery.py
      - name: Compile runner
        run: python -m py_compile scripts/bt5c_authorized_reuse.py scripts/historical_bt5_checkpoint.py scripts/historical_bt5_runner.py
      - name: Prove expected crash after first durable checkpoint
        id: crash
        shell: bash
        run: |
          EXP="bt5-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "experiment=$EXP" >> "$GITHUB_OUTPUT"
          SAMPLE='${{ inputs.sample_securities }}'; SAMPLE="${SAMPLE:-2}"
          SESSIONS='${{ inputs.max_sessions }}'; SESSIONS="${SESSIONS:-250}"
          set +e
          python scripts/historical_bt5_runner.py --experiment-id "$EXP" --runner-commit "$GITHUB_SHA" --max-securities "$SAMPLE" --max-sessions "$SESSIONS" --interrupt-after 1 > /tmp/bt5-expected-crash.log 2>&1
          rc=$?
          set -e
          cat /tmp/bt5-expected-crash.log
          if [ "$rc" -eq 0 ]; then
            echo 'ERROR: runner completed instead of injecting the expected interruption'
            exit 1
          fi
          if ! grep -q 'BT5_TEST_INJECTED_INTERRUPTION_AFTER_DURABLE_CHECKPOINT' /tmp/bt5-expected-crash.log; then
            echo "ERROR: runner failed for an unexpected reason (exit=$rc)"
            exit "$rc"
          fi
          echo "EXPECTED_CRASH_CONFIRMED exit=$rc"
      - name: Resume exact lineage to completion
        run: |
          SAMPLE='${{ inputs.sample_securities }}'; SAMPLE="${SAMPLE:-2}"
          SESSIONS='${{ inputs.max_sessions }}'; SESSIONS="${SESSIONS:-250}"
          python scripts/historical_bt5_runner.py --experiment-id '${{ steps.crash.outputs.experiment }}' --runner-commit "$GITHUB_SHA" --max-securities "$SAMPLE" --max-sessions "$SESSIONS"
      - name: Verify resume evidence and immutable outputs
        run: |
          python - <<'PY'
          import boto3, hashlib, json, os
          exp='${{ steps.crash.outputs.experiment }}'; prefix='research/canslim/historical_bt5/v1'; sample='${{ inputs.sample_securities }}' or '2'; sessions='${{ inputs.max_sessions }}' or '250'
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],region_name='auto',aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); b=os.environ['R2_BUCKET_NAME']
          cp=json.loads(s3.get_object(Bucket=b,Key=f'{prefix}/checkpoints/{exp}.json')['Body'].read()); mf=json.loads(s3.get_object(Bucket=b,Key=f'{prefix}/manifests/{exp}.json')['Body'].read())
          assert mf['status']=='COMPLETE' and mf['completed_count']==int(sample)
          assert mf['validation_session_bound']==int(sessions)
          assert cp['completed_work_units']==sorted(cp['completed_work_units'])
          assert mf['production_eligibility_emitted'] is False and mf['strategy_returns_computed'] is False and mf['bt6_t1_open_computed'] is False
          assert len(mf['output_parts'])==mf['completed_count']
          for part in mf['output_parts']:
              raw=s3.get_object(Bucket=b,Key=part['key'])['Body'].read(); assert hashlib.sha256(raw).hexdigest()==part['stored_sha256']
          print(json.dumps({'verdict':'PASS','experiment_id':exp,'completed':mf['completed_count'],'validation_session_bound':mf['validation_session_bound'],'lineage_sha256':mf['lineage_sha256']},sort_keys=True))
          PY
