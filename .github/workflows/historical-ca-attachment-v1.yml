name: Historical C/A attachment v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-historical-ca-attachment-v1'
      - '.github/workflows/historical-ca-attachment-v1.yml'
      - 'scripts/run_historical_ca_attachment.py'
      - 'src/canslim_research/labels.py'

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow boto3 numpy
      - name: Attach historical PIT C/A labels
        run: python scripts/run_historical_ca_attachment.py
      - name: Show summary
        run: cat results/historical-ca-attachment-v1/summary.json
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: historical-ca-attachment-v1-${{ github.run_id }}
          path: |
            results/historical-ca-attachment-v1/summary.json
            results/historical-ca-attachment-v1/candidate_ca_labels.csv
            results/historical-ca-attachment-v1/fundamentals_current_pointer.json
            results/historical-ca-attachment-v1/fundamentals_snapshot_manifest.json
            results/historical-ca-attachment-v1/membership_snapshot.json
          retention-days: 30
