name: Historical C/A join input audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-historical-ca-join-input-audit'
      - '.github/workflows/historical-ca-join-input-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow boto3
      - name: Audit C/A join inputs
        run: python scripts/audit_historical_ca_join_inputs.py
      - name: Upload audit
        uses: actions/upload-artifact@v7
        with:
          name: historical-ca-join-input-audit-${{ github.run_id }}
          path: results/historical-ca-join-input-audit/summary.json
          retention-days: 30
