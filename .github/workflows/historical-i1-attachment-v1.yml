name: Historical I-v1 attachment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-i1-attachment-v1.yml'
      - 'scripts/run_i1_historical_attachment.py'
      - 'docs/methodology/institutional-sponsorship-growth-v1.md'

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow boto3 numpy duckdb
      - name: Attach historical PIT I-v1 labels
        run: python scripts/run_i1_historical_attachment.py
      - name: Show data-only summary
        run: cat results/historical-i1-attachment-v1/summary.json
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: historical-i1-attachment-v1-${{ github.run_id }}
          path: |
            results/historical-i1-attachment-v1/summary.json
            results/historical-i1-attachment-v1/candidate_i1_labels.csv
          retention-days: 30
