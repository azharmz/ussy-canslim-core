name: Historical golden replay — AVTR 2021
on:
  push:
    branches: [validation/historical-golden-reconstruction-v1]
    paths:
      - scripts/historical_reconstruction_avtr_2021.py
      - .github/workflows/historical-reconstruction-avtr-2021.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Run replay
        shell: bash
        run: |
          set -o pipefail
          python scripts/historical_reconstruction_avtr_2021.py | tee replay.log
      - uses: actions/upload-artifact@v4
        with:
          name: historical-reconstruction-avtr-2021
          path: |
            artifacts/historical-reconstruction/avtr-2021/
            replay.log
