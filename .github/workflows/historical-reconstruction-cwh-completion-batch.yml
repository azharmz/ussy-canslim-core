name: Historical golden replay — CWH completion batch
on:
  push:
    branches: [validation/historical-golden-reconstruction-v1]
    paths:
      - .github/triggers/cwh-completion-batch-v1
      - .github/triggers/cwh-tsla-basis-v2
      - .github/triggers/cwh-tsla-basis-v3
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - tsla_2020
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Run frozen replay
        shell: bash
        run: |
          set -o pipefail
          python scripts/historical_reconstruction_${{ matrix.case }}.py | tee replay-${{ matrix.case }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cwh-${{ matrix.case }}
          path: |
            artifacts/historical-reconstruction/
            replay-${{ matrix.case }}.log
