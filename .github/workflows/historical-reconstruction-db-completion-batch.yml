name: Historical golden replay — DB completion batch
on:
  push:
    branches:
      - validation/historical-golden-reconstruction-v1
    paths:
      - ".github/workflows/historical-reconstruction-db-completion-batch.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [lly_2024, fis_2024, cag_2024, strl_2024, uri_2024, ubs_2024, nxpi_2024]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install replay bootstrap dependencies
        run: python -m pip install pandas
      - name: Run frozen DB replay
        shell: bash
        run: |
          set -o pipefail
          python scripts/historical_reconstruction_db_completion.py "${{ matrix.case }}" | tee "replay-${{ matrix.case }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "db-${{ matrix.case }}"
          path: |
            artifacts/historical-reconstruction/
            replay-*.log
