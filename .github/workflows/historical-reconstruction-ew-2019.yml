name: Historical golden replay — EW 2019
on:
  push:
    branches: [validation/historical-golden-reconstruction-v1]
    paths:
      - scripts/historical_reconstruction_ew_2019.py
      - .github/workflows/historical-reconstruction-ew-2019.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Run replay
        shell: bash
        run: |
          set -o pipefail
          python scripts/historical_reconstruction_ew_2019.py | tee replay.log
      - uses: actions/upload-artifact@v4
        with:
          name: historical-reconstruction-ew-2019
          path: |
            artifacts/historical-reconstruction/ew-2019/
            replay.log

