name: Historical golden replay — Flat Base completion batch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [meta_2024, tw_2024, now_2024, deck_2023, crox_2021, cprt_2020, amzn_2020, kkr_2024]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install replay bootstrap dependencies
        run: python -m pip install pandas
      - name: Run frozen Flat Base replay
        shell: bash
        run: |
          set -o pipefail
          python scripts/historical_reconstruction_flat_base_completion.py "${{ matrix.case }}" | tee "replay-${{ matrix.case }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "flat-base-${{ matrix.case }}"
          path: |
            artifacts/historical-reconstruction/
            replay-*.log
