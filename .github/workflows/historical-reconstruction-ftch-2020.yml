name: Historical golden replay — FTCH 2020
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Run replay
        shell: bash
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -o pipefail
          python scripts/historical_reconstruction_ftch_2020.py | tee replay.log
      - uses: actions/upload-artifact@v4
        with:
          name: historical-reconstruction-ftch-2020
          path: |
            artifacts/historical-reconstruction/ftch-2020/
            replay.log

# trigger after verified provider-secret wiring
