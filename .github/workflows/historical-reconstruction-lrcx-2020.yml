name: Historical golden replay — LRCX 2020
on:
  push:
    branches: [validation/historical-golden-reconstruction-v1]
    paths:
      - scripts/historical_reconstruction_lrcx_2020.py
      - .github/workflows/historical-reconstruction-lrcx-2020.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python scripts/historical_reconstruction_lrcx_2020.py | tee replay.log
      - uses: actions/upload-artifact@v4
        with:
          name: historical-reconstruction-lrcx-2020
          path: |
            artifacts/historical-reconstruction/lrcx-2020/
            replay.log
