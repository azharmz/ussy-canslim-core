name: Historical golden replay — WMT 2024
on:
  push:
    branches: [validation/historical-golden-reconstruction-v1]
    paths:
      - scripts/historical_reconstruction_wmt_2024.py
      - .github/workflows/historical-reconstruction-wmt-2024.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Run replay
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/historical_reconstruction_wmt_2024.py | tee replay.log
      - uses: actions/upload-artifact@v4
        with:
          name: historical-reconstruction-wmt-2024
          path: |
            artifacts/historical-reconstruction/wmt-2024/
            replay.log
