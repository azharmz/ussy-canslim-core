name: I0 SEC 13F coverage audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i0-13f-coverage-audit.yml'
      - 'scripts/run_i0_13f_coverage_audit.py'
      - 'docs/methodology/institutional-sponsorship-v1.md'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas boto3
      - name: Run I0 data-quality coverage audit
        run: python scripts/run_i0_13f_coverage_audit.py
      - name: Show summary
        run: cat results/i0-13f-coverage-audit/summary.json
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: i0-13f-coverage-audit-${{ github.run_id }}
          path: results/i0-13f-coverage-audit/
          retention-days: 90
