name: I1 staged SEC 13F normalize

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_i1_13f_normalize_staged.py'
      - '.github/workflows/i1-13f-normalize-staged.yml'

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas boto3
      - name: Normalize staged first-party SEC 13F source
        run: python scripts/run_i1_13f_normalize_staged.py
      - name: Show summary
        run: cat results/i1-13f-normalize-staged/summary.json
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: i1-13f-normalize-staged-${{ github.run_id }}
          path: results/i1-13f-normalize-staged/
