name: P8 DEVELOPMENT Source Probe

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Ticker to probe
        required: true
        default: SNPS
      start:
        description: Inclusive start date
        required: true
        default: "2023-01-01"
      end:
        description: Inclusive end date
        required: true
        default: "2023-12-31"
  push:
    branches: [main]
    paths:
      - '.github/workflows/p8-development-probe.yml'
      - 'src/canslim_research/ohlcv_router.py'
      - 'src/canslim_research/ohlcv_providers.py'
      - 'scripts/run_p8_development.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      TICKER: ${{ inputs.ticker || 'SNPS' }}
      START_DATE: ${{ inputs.start || '2023-01-01' }}
      END_DATE: ${{ inputs.end || '2023-12-31' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow boto3 yfinance

      - name: Probe DEVELOPMENT OHLCV route
        run: |
          python scripts/run_p8_development.py \
            --ticker "${TICKER}" \
            --start "${START_DATE}" \
            --end "${END_DATE}" \
            --split DEVELOPMENT \
            --output results/p8-development-source.json

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-development-source-${{ env.TICKER }}
          path: results/p8-development-source.json
          if-no-files-found: warn
