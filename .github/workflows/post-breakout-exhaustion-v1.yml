name: Post-breakout exhaustion diagnostics v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-post-breakout-exhaustion-v1'
      - '.github/workflows/post-breakout-exhaustion-v1.yml'
      - 'scripts/run_post_breakout_exhaustion_diagnostics.py'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow boto3 numpy
      - name: Run post-breakout exhaustion diagnostics
        run: python scripts/run_post_breakout_exhaustion_diagnostics.py
      - name: Show summary
        run: cat results/post-breakout-exhaustion-v1/summary.json
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: post-breakout-exhaustion-v1-${{ github.run_id }}
          path: |
            results/post-breakout-exhaustion-v1/summary.json
            results/post-breakout-exhaustion-v1/candidate_exhaustion_features.csv
            results/post-breakout-exhaustion-v1/shock_deciles.csv
            results/post-breakout-exhaustion-v1/shock_x_t1_rejection.csv
            results/post-breakout-exhaustion-v1/membership_snapshot.json
          retention-days: 30
