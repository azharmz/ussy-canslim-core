name: R2 candidate snapshot cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run only unless explicitly set to apply'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply]
      as_of_date:
        description: 'Optional YYYY-MM-DD; blank audits all dates'
        required: false
        type: string
      keep_newest:
        description: 'Minimum newest run snapshots retained per date'
        required: true
        default: '2'
        type: string
  # One-shot cleanup after retention semantics were corrected to one canonical
  # snapshot per session date. Hard-scoped to the already-audited 2026-09-14 date.
  push:
    branches: [main]
    paths:
      - '.github/workflows/r2-candidate-snapshot-cleanup.yml'

permissions:
  contents: read
concurrency:
  group: canslim-r2-candidate-cleanup
  cancel-in-progress: false
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install R2 client
        run: python -m pip install --disable-pip-version-check boto3
      - name: Remove audited redundant same-date predecessor or manual mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'push' ]]; then
            python scripts/cleanup_duplicate_candidate_snapshots.py --date 2026-09-14 --keep-newest 1 --apply
            exit 0
          fi
          args=(--keep-newest '${{ inputs.keep_newest }}')
          if [[ -n '${{ inputs.as_of_date }}' ]]; then args+=(--date '${{ inputs.as_of_date }}'); fi
          if [[ '${{ inputs.mode }}' == 'apply' ]]; then args+=(--apply); fi
          python scripts/cleanup_duplicate_candidate_snapshots.py "${args[@]}"
