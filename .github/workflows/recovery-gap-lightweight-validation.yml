name: recovery-gap-lightweight-validation

on:
  push:
    paths:
      - '.github/recovery-gap-validation-trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Checkout frozen O'Neil pattern repo
        uses: actions/checkout@v7
        with:
          repository: azharmz/ussy-oneil-patterns
          path: oneil-patterns
          ref: c433cc1e35a5aa32a46f732cd8c5545935e36e40
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check pytest pandas pyarrow boto3 numpy
          python -m pip install --disable-pip-version-check -e ./oneil-patterns
      - name: Compile changed production scripts
        run: python -m py_compile scripts/publish_production_candidates.py scripts/publish_production_entries.py
      - name: Recovery and production-boundary regressions
        run: python -m pytest -q tests/test_phase9_cross_session_handoff.py tests/test_phase7_entry_publisher_contract.py tests/test_phase8_lifecycle_publisher_contract.py
