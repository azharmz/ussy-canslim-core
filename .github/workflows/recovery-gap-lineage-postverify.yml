name: recovery-gap-lineage-postverify
on:
  pull_request:
    paths: ['.github/recovery-gap-lineage-postverify-trigger']
permissions: {contents: read}
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check boto3
      - run: |
          python - <<'PY'
          import json,os,boto3
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],region_name='auto',aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); b=os.environ['R2_BUCKET_NAME']
          J=lambda k:json.loads(s3.get_object(Bucket=b,Key=k)['Body'].read())
          p=J('canslim/candidates/current.json'); m=J(p['manifest_key'])
          print(json.dumps({'pointer':p,'manifest_top_keys':sorted(m.keys()),'manifest':m},indent=2,default=str))
          PY
