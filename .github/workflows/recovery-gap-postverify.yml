name: recovery-gap-postverify
on:
  pull_request:
    paths:
      - '.github/recovery-gap-postverify-trigger'
permissions:
  contents: read
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check boto3
      - name: Verify canonical 2026-09-17 Candidate state
        run: |
          python - <<'PY'
          import json, os, re, boto3
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],region_name='auto',aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'])
          b=os.environ['R2_BUCKET_NAME']
          def raw(k): return s3.get_object(Bucket=b,Key=k)['Body'].read()
          def js(k): return json.loads(raw(k))
          p=js('canslim/candidates/current.json')
          m=js(p['manifest_key'])
          prefix='canslim/candidates/snapshots/2026-09-17/'
          objs=[]; token=None
          while True:
            kw={'Bucket':b,'Prefix':prefix}
            if token: kw['ContinuationToken']=token
            page=s3.list_objects_v2(**kw); objs += [x['Key'] for x in page.get('Contents',[])]
            if not page.get('IsTruncated'): break
            token=page['NextContinuationToken']
          runs=sorted(set(k.split('/')[4] for k in objs if len(k.split('/'))>4 and k.split('/')[4].startswith('run-')))
          out={'pointer_asof':p.get('asof_date'),'snapshot_prefix':p.get('snapshot_prefix'),'manifest_key':p.get('manifest_key'),
               'candidate_count':p.get('candidate_count'),'storage_contract':p.get('storage_contract'),
               'snapshot_runs_2026_09_17':runs,'snapshot_run_count':len(runs),
               'manifest_ready_key':m.get('ready_parquet_key') or m.get('source_ready_parquet_key') or m.get('ready_source',{}).get('parquet_key'),
               'manifest_ready_sha':m.get('ready_parquet_sha256') or m.get('source_ready_sha256') or m.get('ready_source',{}).get('sha256'),
               'manifest_asof':m.get('asof_date'),'manifest_created_at':m.get('created_at') or m.get('produced_at')}
          print(json.dumps(out,indent=2,sort_keys=True))
          if p.get('asof_date')!='2026-09-17': raise SystemExit('pointer not 2026-09-17')
          if len(runs)!=1: raise SystemExit(f'expected exactly one retained canonical run for 2026-09-17, got {runs}')
          PY
