name: recovery-gap-r2-preflight

on:
  pull_request:
    paths:
      - '.github/recovery-gap-r2-preflight-trigger'

permissions:
  contents: read

env:
  PYTHONPATH: src:.
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  R2_STORAGE_WARNING_GIB: '7'
  R2_STORAGE_HARD_STOP_GIB: '9'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check boto3 pandas pyarrow
      - name: Whole-bucket storage preflight
        run: python scripts/audit_r2_storage.py
      - name: Audit READY and Candidate recovery identities
        shell: bash
        run: |
          python - <<'PY'
          import io, json, os, re
          import boto3, pandas as pd
          s3=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],region_name='auto',
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'])
          b=os.environ['R2_BUCKET_NAME']
          def js(k): return json.loads(s3.get_object(Bucket=b,Key=k)['Body'].read())
          ready=js('production/ready/current.json')
          rb=s3.get_object(Bucket=b,Key=ready['parquet_key'])['Body'].read()
          rdf=pd.read_parquet(io.BytesIO(rb),columns=['date'])
          latest=pd.to_datetime(rdf['date']).dt.date.max().isoformat()
          try: cand=js('canslim/candidates/current.json'); current=cand.get('asof_date')
          except Exception: current=None
          keys=[]; token=None
          while True:
              kw={'Bucket':b,'Prefix':'production/ready/runs/'}
              if token: kw['ContinuationToken']=token
              page=s3.list_objects_v2(**kw); keys += [x['Key'] for x in page.get('Contents',[])]
              if not page.get('IsTruncated'): break
              token=page['NextContinuationToken']
          dates=sorted(m.group(1) for k in keys if (m:=re.fullmatch(r'production/ready/runs/(\d{4}-\d{2}-\d{2})\.parquet',k)) and m.group(1)<=latest)
          unresolved=[d for d in dates if not current or d>current]
          print(json.dumps({'ready_current':latest,'ready_current_key':ready['parquet_key'],'candidate_current':current,
              'unresolved_ready_dates':unresolved,'next_recovery_date':unresolved[0] if unresolved else None},indent=2))
          PY
