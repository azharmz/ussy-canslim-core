name: remediation-phase12-prospective-dry-run

# Historical Phase-12 acceptance workflow.
# After production-baseline freeze this workflow is validation-only: it MUST NOT
# publish Candidate/Entry/Lifecycle objects or advance mutable R2 pointers.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remediation-phase12-prospective-dry-run.yml'

permissions:
  contents: read

concurrency:
  group: canslim-validation
  cancel-in-progress: false

env:
  PYTHONPATH: src:.

jobs:
  prospective-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Checkout frozen O'Neil pattern repo
        uses: actions/checkout@v7
        with:
          repository: azharmz/ussy-oneil-patterns
          path: oneil-patterns
          ref: c433cc1e35a5aa32a46f732cd8c5545935e36e40
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest pandas pyarrow boto3 numpy
          python -m pip install --disable-pip-version-check -e ./oneil-patterns
      - name: Frozen remediation regressions
        run: >-
          python -m pytest -q
          tests/test_decision_time.py
          tests/test_eligibility_contract.py
          tests/test_candidate_v2.py
          tests/test_execution_entry_v1.py
          tests/test_phase7_entry_publisher_contract.py
          tests/test_phase8_lifecycle_publisher_contract.py
          tests/test_phase9_cross_session_handoff.py
          tests/test_position_lifecycle_v2.py
      - name: Confirm validation is non-mutating
        run: |
          test -z "${R2_ACCESS_KEY_ID:-}"
          test -z "${R2_SECRET_ACCESS_KEY:-}"
          test -z "${R2_ENDPOINT:-}"
          test -z "${R2_BUCKET_NAME:-}"
          echo "Phase 12 frozen validation has no R2 credentials and cannot publish production snapshots."
