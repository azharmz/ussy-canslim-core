name: remediation-phase12-prospective-dry-run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remediation-phase12-prospective-dry-run.yml'

permissions:
  contents: read

concurrency:
  group: canslim-production-e2e
  cancel-in-progress: false

env:
  PYTHONPATH: src:.
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  CANSLIM_RETENTION_DAYS: '7'
  CANSLIM_RETENTION_KEEP_NEWEST: '2'
  R2_STORAGE_WARNING_GIB: '7'
  R2_STORAGE_HARD_STOP_GIB: '9'

jobs:
  prospective-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Checkout frozen O'Neil pattern repo
        uses: actions/checkout@v7
        with:
          repository: azharmz/ussy-oneil-patterns
          path: oneil-patterns
          ref: c433cc1e35a5aa32a46f732cd8c5545935e36e40
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest pandas pyarrow boto3 numpy
          python -m pip install --disable-pip-version-check -e ./oneil-patterns
      - name: Frozen remediation regressions
        run: >-
          python -m pytest -q
          tests/test_decision_time.py
          tests/test_eligibility_contract.py
          tests/test_candidate_v2.py
          tests/test_execution_entry_v1.py
          tests/test_phase7_entry_publisher_contract.py
          tests/test_phase8_lifecycle_publisher_contract.py
          tests/test_phase9_cross_session_handoff.py
          tests/test_position_lifecycle_v2.py
      - name: Preflight R2 storage hard guard
        run: python scripts/audit_r2_storage.py
      - name: Consume prior immutable candidate prospectively
        run: python scripts/publish_production_entries.py
      - name: Advance lifecycle without synthetic population
        run: python scripts/publish_production_lifecycle.py
      - name: Publish current-session candidates from frozen contracts
        run: python scripts/publish_production_candidates.py
      - name: Losslessly compact immutable candidate snapshot
        run: python scripts/compact_candidate_snapshot.py
      - name: Apply protected retention
        run: python scripts/retain_candidate_snapshots.py
      - name: Verify post-run R2 storage
        run: python scripts/audit_r2_storage.py
