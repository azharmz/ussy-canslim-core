name: remediation-phase4-market-state

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remediation-phase4-market-state.yml'
      - 'src/canslim_research/market_state_consumer.py'
      - 'tests/test_market_state_consumer.py'
      - 'scripts/audit_phase4_market_state.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas pyarrow boto3
      - name: Canonical M consumer tests
        run: python -m pytest -q tests/test_market_state_consumer.py
      - name: Frozen #45 action regression
        run: python -m pytest -q tests/test_market_exposure_action_v1.py
      - name: Frozen #46 classifier regression
        run: python -m pytest -q tests/test_market_state_v1.py
      - name: Real R2 canonical M audit
        run: python scripts/audit_phase4_market_state.py
      - name: Show Phase 4 evidence
        run: cat results/remediation-phase4-market-state/summary.json
      - name: Upload Phase 4 evidence
        uses: actions/upload-artifact@v7
        with:
          name: remediation-phase4-market-state-${{ github.run_id }}
          path: results/remediation-phase4-market-state/summary.json
          retention-days: 30
