name: remediation-phase6-input-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remediation-phase6-input-audit.yml'
      - 'scripts/audit_phase6_candidate_inputs.py'
      - 'src/canslim_research/candidate_v2_adapters.py'
      - 'tests/test_candidate_v2.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas pyarrow boto3
      - name: C/A adapter regression
        run: python -m pytest -q tests/test_candidate_v2.py
      - name: Real R2 production input audit
        run: python scripts/audit_phase6_candidate_inputs.py
      - name: Show evidence
        run: cat results/remediation-phase6-input-audit/summary.json
      - uses: actions/upload-artifact@v7
        with:
          name: remediation-phase6-input-audit-${{ github.run_id }}
          path: results/remediation-phase6-input-audit/summary.json
          retention-days: 30
