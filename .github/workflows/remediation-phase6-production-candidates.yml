name: remediation-phase6-production-candidates

# Operator-only low-level publisher. Normal production cadence is owned by
# remediation-phase9-e2e-orchestrator and gated on a new finalized READY session.
# Code pushes must never create immutable production candidate snapshots.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canslim-production-candidate-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - name: Checkout CAN SLIM repo
        uses: actions/checkout@v7
      - name: Checkout frozen O'Neil pattern repo
        uses: actions/checkout@v7
        with:
          repository: azharmz/ussy-oneil-patterns
          path: oneil-patterns
          ref: c433cc1e35a5aa32a46f732cd8c5545935e36e40
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and pinned pattern engine
        run: |
          python -m pip install --disable-pip-version-check pytest pandas pyarrow boto3 numpy
          python -m pip install --disable-pip-version-check -e ./oneil-patterns
      - name: Verify pinned pattern contract
        run: |
          test "$(git -C oneil-patterns rev-parse HEAD)" = "c433cc1e35a5aa32a46f732cd8c5545935e36e40"
          PYTHONPATH=src python - <<'PY'
          from canslim_research.candidate_v2 import EXPECTED_PATTERN_ENGINE_VERSION, PATTERN_SCHEMA_VERSION
          assert EXPECTED_PATTERN_ENGINE_VERSION == '33-core-p8-frozen-v1'
          assert PATTERN_SCHEMA_VERSION == 'oneil-pattern-output-v2'
          PY
      - name: Candidate correctness regression
        run: |
          python -m pytest -q tests/test_eligibility_contract.py
          python -m pytest -q tests/test_candidate_v2.py
          python -m pytest -q tests/test_institutional_pit.py
          python -m pytest -q tests/test_market_state_consumer.py
      - name: Re-audit production input contracts
        run: python scripts/audit_phase6_candidate_inputs.py
      - name: Publish immutable candidate snapshot then pointer
        run: python scripts/publish_production_candidates.py
