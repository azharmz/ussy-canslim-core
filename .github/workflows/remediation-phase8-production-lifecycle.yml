name: remediation-phase8-production-lifecycle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_production_lifecycle.py'
      - 'src/canslim_research/position_lifecycle_v2.py'
      - 'src/canslim_research/sell_risk_v1.py'
      - 'src/canslim_research/technical_deterioration_action_v1.py'
      - 'src/canslim_research/round_trip_action_v1.py'
      - 'tests/test_position_lifecycle_v2.py'
      - 'tests/test_phase8_lifecycle_publisher_contract.py'
      - '.github/workflows/remediation-phase8-production-lifecycle.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest boto3
      - name: Frozen lifecycle regression and publisher contract
        run: |
          python -m pytest -q tests/test_position_lifecycle_v2.py
          python -m pytest -q tests/test_phase8_lifecycle_publisher_contract.py
      - name: Publish truthful lifecycle state pointer-last
        run: python scripts/publish_production_lifecycle.py
