name: V35-D review packet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v35d-review-packet.yml'
      - 'scripts/run_v35d_review_packet.py'
      - 'evidence/v35/frozen_case_ids_v1.csv'

permissions:
  contents: read

jobs:
  v35d:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas pyarrow boto3 matplotlib numpy scipy
          python -m pip install --disable-pip-version-check git+https://github.com/azharmz/ussy-oneil-patterns.git@c433cc1e35a5aa32a46f732cd8c5545935e36e40
      - name: Build V35-D review packet
        run: python scripts/run_v35d_review_packet.py
      - name: Show summary
        run: cat results/v35d-review-packet/summary.json
      - name: Upload V35-D packet
        uses: actions/upload-artifact@v7
        with:
          name: v35d-review-packet-${{ github.run_id }}
          path: results/v35d-review-packet/
          retention-days: 30
