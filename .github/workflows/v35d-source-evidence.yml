name: V35-D source evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v35d-source-evidence.yml'
      - 'scripts/run_v35d_source_evidence_audit.py'
      - 'evidence/v35/frozen_case_ids_v1.csv'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow boto3
      - name: Recompute frozen-case source evidence
        run: python scripts/run_v35d_source_evidence_audit.py
      - name: Show summary
        run: cat results/v35d-source-evidence/summary.json
      - name: Upload source evidence
        uses: actions/upload-artifact@v7
        with:
          name: v35d-source-evidence-${{ github.run_id }}
          path: results/v35d-source-evidence/
          retention-days: 30
